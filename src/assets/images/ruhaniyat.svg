<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="warm_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#0E223D" />
      <stop offset="100%" stop-color="#06101E" />
    </linearGradient>
    <radialGradient id="heart_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#warm_bg)" />
  <circle cx="600" cy="380" r="420" fill="url(#heart_glow)" />

  <!-- Community Dialogue Circle Concentric Waves (Empathy & Safe Spaces) -->
  <circle cx="600" cy="380" r="320" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="8 6" />
  <circle cx="600" cy="380" r="240" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.25" />
  <circle cx="600" cy="380" r="160" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="600" cy="380" r="80" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Top Metadata Ribbon -->
  <g transform="translate(600, 110)">
    <rect x="-180" y="-24" width="360" height="32" rx="4" fill="#0C1829" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="-3" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="4">BENNETT UNIVERSITY · MENTAL WELLNESS</text>
    <text x="0" y="50" text-anchor="middle" font-family="'Cinzel', serif" font-size="44" font-weight="900" fill="#FAF9F5" letter-spacing="3">RUHANIYAT</text>
    <text x="0" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="2">HEAD OF RUHANIYAT · EMPATHY, COMMUNITY &amp; PEER DIALOGUE</text>
  </g>

  <!-- Circular Seated Community Group (Dialogue Circle) -->
  <g transform="translate(600, 420)">
    <!-- Central Safe Space Hearth / Lantern -->
    <circle cx="0" cy="0" r="28" fill="#0C1829" stroke="#38BDF8" stroke-width="2" />
    <!-- Warm Hearth Flame / Glow -->
    <path d="M 0 -14 C 10 -4 12 10 0 16 C -12 10 -10 -4 0 -14 Z" fill="#38BDF8" />
    <circle cx="0" cy="4" r="5" fill="#FAF9F5" />

    <!-- 8 Community Members in Empathetic Circle -->
    <!-- Member 1: Top (Captain / Facilitator) -->
    <circle cx="0" cy="-140" r="14" fill="#FAF9F5" stroke="#38BDF8" stroke-width="2" />
    <path d="M -18 -115 C -18 -125 18 -125 18 -115 L 14 -85 L -14 -85 Z" fill="#0F2442" stroke="#38BDF8" stroke-width="1" />

    <!-- Member 2: Top Right -->
    <circle cx="100" cy="-100" r="12" fill="#E2E8F0" />
    <circle cx="140" cy="0" r="12" fill="#E2E8F0" />
    <circle cx="100" cy="100" r="12" fill="#E2E8F0" />
    <circle cx="0" cy="140" r="12" fill="#E2E8F0" />
    <circle cx="-100" cy="100" r="12" fill="#E2E8F0" />
    <circle cx="-140" cy="0" r="12" fill="#E2E8F0" />
    <circle cx="-100" cy="-100" r="12" fill="#E2E8F0" />

    <!-- Dialogue Arc Lines Connecting Members -->
    <path d="M 0 -85 Q 50 -40 100 -20" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6" />
    <path d="M 100 -20 Q 80 50 0 100" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6" />
    <path d="M 0 100 Q -80 50 -100 -20" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6" />
    <path d="M -100 -20 Q -50 -40 0 -85" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6" />
  </g>

  <!-- Lower Quotation Banner -->
  <g transform="translate(600, 680)">
    <text x="0" y="-10" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="20" font-style="italic" font-weight="600" fill="#FAF9F5">
      “Creating safe spaces for the conversations that matter most.”
    </text>
    <text x="0" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="3">
      PEER DIALOGUE · MENTAL HEALTH FORUMS · BENNETT UNIVERSITY
    </text>
  </g>
</svg>
