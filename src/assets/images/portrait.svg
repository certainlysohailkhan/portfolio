<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="45%" stop-color="#0F2442" />
      <stop offset="100%" stop-color="#07101E" />
    </linearGradient>
    <linearGradient id="gold_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="halo_glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#1E3A5F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="flight_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="0" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bg_grad)" />
  <rect width="800" height="1000" fill="url(#flight_grid)" />
  <circle cx="400" cy="380" r="320" fill="url(#halo_glow)" />

  <!-- Outer Aircraft Window / Frame Bezel -->
  <rect x="24" y="24" width="752" height="952" rx="20" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" />
  <rect x="36" y="36" width="728" height="928" rx="14" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- Corner Rivets / Aviation Fasteners -->
  <circle cx="48" cy="48" r="4" fill="#0C1829" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="752" cy="48" r="4" fill="#0C1829" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="48" cy="952" r="4" fill="#0C1829" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="752" cy="952" r="4" fill="#0C1829" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />

  <!-- Top Header Metadata Bar -->
  <line x1="48" y1="90" x2="752" y2="90" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4" />
  <text x="60" y="74" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="3">FLIGHT DISPATCH · VERIFIED PORTRAIT PLATE</text>
  <text x="740" y="74" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="2">SK-2026 / 01A</text>

  <!-- Central Executive Silhouette & Monograph Composition -->
  <!-- Ambient concentric rings (radar flight path) -->
  <circle cx="400" cy="420" r="260" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="8 8" />
  <circle cx="400" cy="420" r="190" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.18" />
  <circle cx="400" cy="420" r="120" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.25" />

  <!-- Compass crosshairs -->
  <line x1="120" y1="420" x2="680" y2="420" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6" />
  <line x1="400" y1="140" x2="400" y2="700" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6" />

  <!-- Executive Portrait Silhouette / Figure -->
  <g transform="translate(400, 420)">
    <!-- Base Glow -->
    <ellipse cx="0" cy="180" rx="220" ry="90" fill="#0C1829" fill-opacity="0.9" />
    
    <!-- Torso / Blazer silhouette -->
    <path d="M -160 260 L -140 140 C -120 70 -60 40 0 40 C 60 40 120 70 140 140 L 160 260 Z" fill="#0A182F" stroke="#1E3A5F" stroke-width="2" />
    <!-- Lapels -->
    <path d="M -70 80 L 0 210 L 70 80" fill="#071120" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M -40 140 L 0 220 L 40 140" fill="#0C1829" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.5" />
    <!-- Crisp Shirt Collar & Tie Line -->
    <polygon points="-30,70 0,110 30,70 0,85" fill="#FAF9F5" />
    <polygon points="-8,105 8,105 5,180 -5,180" fill="#0C1829" stroke="#38BDF8" stroke-width="0.75" />

    <!-- Neck & Head Shape -->
    <path d="M -25 70 L -25 35 C -25 35 0 38 25 35 L 25 70 Z" fill="#E2E8F0" />
    <!-- Jaw and Head Oval -->
    <path d="M 0 -90 C 55 -90 75 -50 70 15 C 65 50 35 68 0 70 C -35 68 -65 50 -70 15 C -75 -50 -55 -90 0 -90 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Modern Hair & Grooming Contour -->
    <path d="M -72 -20 C -75 -60 -60 -105 -10 -115 C 30 -120 75 -100 80 -60 C 82 -40 78 -20 74 -10 C 66 -40 50 -85 0 -88 C -45 -88 -60 -45 -72 -20 Z" fill="#0C1829" />
    <!-- Facial Features Profile Lines (Editorial Minimalist Art) -->
    <!-- Eyes / Eyebrows -->
    <path d="M -45 -22 Q -30 -30 -12 -22" fill="none" stroke="#0C1829" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 -22 Q 30 -30 45 -22" fill="none" stroke="#0C1829" stroke-width="3" stroke-linecap="round" />
    <!-- Eyes -->
    <ellipse cx="-28" cy="-12" rx="7" ry="3.5" fill="#0C1829" />
    <ellipse cx="28" cy="-12" rx="7" ry="3.5" fill="#0C1829" />
    <circle cx="-27" cy="-13" r="1.5" fill="#FFFFFF" />
    <circle cx="29" cy="-13" r="1.5" fill="#FFFFFF" />
    <!-- Nose bridge -->
    <path d="M 0 -20 L 2 10 L -6 18" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Confident expression lips -->
    <path d="M -20 38 Q 0 45 20 38" fill="none" stroke="#0C1829" stroke-width="2.5" stroke-linecap="round" />

    <!-- Aviator / Vision Monogram Seal Pin -->
    <circle cx="85" cy="190" r="18" fill="#071120" stroke="#38BDF8" stroke-width="1.5" />
    <text x="85" y="195" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" font-weight="900" fill="#38BDF8">SK</text>
  </g>

  <!-- Lower Flight Data Card / Monograph Plaque -->
  <rect x="60" y="720" width="680" height="200" rx="8" fill="#07101E" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.35" />
  
  <text x="88" y="760" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="3">CAPTAIN · EXECUTIVE PROFILE</text>
  <text x="88" y="805" font-family="'Cinzel', 'Times New Roman', serif" font-size="34" font-weight="800" fill="#FAF9F5" letter-spacing="1">SOHAIL KHAN</text>
  <text x="88" y="836" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#BAE6FD" letter-spacing="0.5">AI Product Manager · Growth Consultant · TEDx Speaker</text>

  <line x1="88" y1="855" x2="712" y2="855" stroke="#1E293B" stroke-width="1" />

  <!-- Coordinates & Altimeter Telemetry -->
  <g transform="translate(88, 885)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">ORIGIN: <tspan fill="#F8FAFC" font-weight="700">DEL / GURGAON (28.4595° N, 77.0266° E)</tspan></text>
    <text x="360" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">STATUS: <tspan fill="#38BDF8" font-weight="700">ACTIVE FLIGHT PATH</tspan></text>
  </g>
</svg>
