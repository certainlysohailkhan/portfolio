<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="stage_spotlight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <radialGradient id="red_circle_carpet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="70%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </radialGradient>
    <linearGradient id="back_screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Auditorium Darkness & Spotlight Stage -->
  <rect width="1200" height="750" fill="url(#stage_spotlight)" />

  <!-- Overhead Theater Light Cones -->
  <polygon points="600,0 350,560 850,560" fill="#FFFFFF" fill-opacity="0.04" />
  <polygon points="400,0 200,600 600,600" fill="#38BDF8" fill-opacity="0.03" />
  <polygon points="800,0 600,600 1000,600" fill="#38BDF8" fill-opacity="0.03" />

  <!-- Stage Backdrop Giant Projection Screen -->
  <rect x="180" y="70" width="840" height="340" rx="10" fill="url(#back_screen)" stroke="#1E293B" stroke-width="2" />
  <rect x="190" y="80" width="820" height="320" rx="6" fill="#030712" />

  <!-- Backdrop TEDx Large Projection Typography -->
  <g transform="translate(600, 160)">
    <!-- Red TED + White x -->
    <text x="-50" y="30" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="900" fill="#E11D48" letter-spacing="-2">TED</text>
    <text x="35" y="6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">x</text>
    <text x="0" y="85" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="4">INDEPENDENTLY ORGANIZED EVENT</text>

    <!-- Keynote Topic -->
    <line x1="-200" y1="120" x2="200" y2="120" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="155" text-anchor="middle" font-family="'Cinzel', serif" font-size="28" font-weight="700" fill="#FAF9F5" letter-spacing="2">
      LEADERSHIP &amp; CONSISTENCY
    </text>
    <text x="0" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#38BDF8" letter-spacing="1">
      KEYNOTE ADDRESS · SOHAIL KHAN
    </text>
  </g>

  <!-- Stage Floor Plane -->
  <polygon points="0,520 1200,520 1200,750 0,750" fill="#070D18" />
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#1E293B" stroke-width="1.5" />

  <!-- Iconic Circular Red Carpet Dot on Stage -->
  <ellipse cx="600" cy="620" rx="260" ry="75" fill="url(#red_circle_carpet)" stroke="#EF4444" stroke-width="3" />
  <ellipse cx="600" cy="620" rx="260" ry="75" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Speaker Silhouette on the Red Dot -->
  <g transform="translate(600, 520)">
    <!-- Floor shadow -->
    <ellipse cx="0" cy="90" rx="45" ry="16" fill="#000000" fill-opacity="0.7" />

    <!-- Speaker Figure Body -->
    <!-- Legs -->
    <path d="M -18 90 L -12 30 L 12 30 L 18 90" fill="#090E17" stroke="#1E293B" stroke-width="1" />
    <!-- Suit Jacket -->
    <path d="M -28 30 L -22 -50 L 22 -50 L 28 30 Z" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <!-- White shirt collar -->
    <polygon points="-8,-48 0,-30 8,-48" fill="#F8FAFC" />
    <!-- Head & Neck -->
    <rect x="-6" y="-56" width="12" height="10" fill="#CBD5E1" />
    <circle cx="0" cy="-70" r="15" fill="#E2E8F0" />
    <!-- Hair -->
    <path d="M -15 -74 C -12 -88 12 -88 15 -74 C 15 -68 12 -62 0 -62 C -12 -62 -15 -68 -15 -74 Z" fill="#090E17" />
    <!-- Gesturing Hands (Orator pose) -->
    <path d="M -22 -30 L -46 -15" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
    <path d="M 22 -30 L 48 -22" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />

    <!-- Headset Microphone Line -->
    <path d="M 10 -70 Q 20 -60 12 -52" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Stage Monitor & Downstage Floor Lighting -->
  <polygon points="340,680 400,680 390,650 350,650" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <polygon points="800,680 860,680 850,650 810,650" fill="#1E293B" stroke="#334155" stroke-width="1" />

  <!-- Footlights along Stage Edge -->
  <g fill="#38BDF8" opacity="0.8">
    <circle cx="200" cy="720" r="3" />
    <circle cx="400" cy="720" r="3" />
    <circle cx="600" cy="720" r="3" />
    <circle cx="800" cy="720" r="3" />
    <circle cx="1000" cy="720" r="3" />
  </g>

  <!-- Lower Archive Label Plaque -->
  <rect x="50" y="680" width="300" height="40" rx="4" fill="#0C1829" stroke="#1E293B" stroke-width="1" />
  <text x="65" y="705" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">
    TEDx SPEAKER · STAGE ARCHIVE 2022
  </text>
</svg>
