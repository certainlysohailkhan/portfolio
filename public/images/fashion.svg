<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="runway_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="runway_floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
  </defs>

  <!-- Dark Atmospheric Runway Arena -->
  <rect width="1200" height="750" fill="url(#runway_bg)" />

  <!-- Overhead Truss & Studio Lighting Rigs -->
  <line x1="100" y1="40" x2="1100" y2="40" stroke="#334155" stroke-width="4" />
  <line x1="100" y1="60" x2="1100" y2="60" stroke="#334155" stroke-width="2" />

  <!-- Studio Spotlights & Beams -->
  <polygon points="300,60 520,600 680,600" fill="#FFFFFF" fill-opacity="0.05" />
  <polygon points="900,60 520,600 680,600" fill="#38BDF8" fill-opacity="0.04" />
  <polygon points="600,60 480,650 720,650" fill="#F59E0B" fill-opacity="0.03" />

  <!-- Perspective Runway Catwalk -->
  <polygon points="540,260 660,260 840,750 360,750" fill="url(#runway_floor)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Runway Center Guide Lights -->
  <line x1="600" y1="260" x2="600" y2="750" stroke="#38BDF8" stroke-width="2" stroke-dasharray="12 12" stroke-opacity="0.8" />
  
  <!-- Runway Side Strip LED Glow -->
  <line x1="540" y1="260" x2="360" y2="750" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.6" />
  <line x1="660" y1="260" x2="840" y2="750" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.6" />

  <!-- Central Editorial Backdrop Banner -->
  <rect x="360" y="90" width="480" height="150" rx="4" fill="#0C1829" stroke="#1E293B" stroke-width="2" />
  
  <g transform="translate(600, 140)">
    <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="4">BENNETT UNIVERSITY</text>
    <text x="0" y="36" text-anchor="middle" font-family="'Cinzel', serif" font-size="30" font-weight="900" fill="#FAF9F5" letter-spacing="3">FASHION SOCIETY</text>
    <text x="0" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="2">HEAD OF SOCIETY · CREATIVE DIRECTION</text>
  </g>

  <!-- Editorial Fashion Silhouette Composition -->
  <g transform="translate(600, 440)">
    <!-- Runway Floor Reflection -->
    <ellipse cx="0" cy="180" rx="90" ry="24" fill="#000000" fill-opacity="0.6" />
    
    <!-- Stylized High-Fashion Model / Creative Director Figure -->
    <!-- Flowing Cape / Trench Silhouette -->
    <path d="M 0 -80 C -40 -70 -70 -20 -80 120 L -30 140 L 0 40 L 30 140 L 80 120 C 70 -20 40 -70 0 -80 Z" fill="#0A1424" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- Tailored Blazer / Vest -->
    <path d="M -26 -40 L -18 60 L 18 60 L 26 -40 Z" fill="#020617" stroke="#F59E0B" stroke-width="1" />
    <!-- Gold Lapel Accents -->
    <path d="M -16 -40 L 0 10 L 16 -40" fill="none" stroke="#F59E0B" stroke-width="2" />

    <!-- Head & Hat/Silhouette Profile -->
    <circle cx="0" cy="-60" r="16" fill="#E2E8F0" />
    <path d="M -28 -72 C -15 -85 15 -85 28 -72 L 35 -65 L -35 -65 Z" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />

    <!-- Sharp Stride Lines -->
    <line x1="-15" y1="60" x2="-25" y2="175" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />
    <line x1="15" y1="60" x2="25" y2="175" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Camera Flashes in the Front Rows -->
  <g fill="#FFFFFF">
    <circle cx="280" cy="560" r="4" fill-opacity="0.9" />
    <circle cx="260" cy="620" r="3" fill-opacity="0.7" />
    <circle cx="920" cy="540" r="4" fill-opacity="0.9" />
    <circle cx="950" cy="610" r="3" fill-opacity="0.7" />
  </g>

  <!-- Lower Left Information Tag -->
  <rect x="50" y="680" width="340" height="40" rx="4" fill="#0C1829" stroke="#1E293B" stroke-width="1" />
  <text x="65" y="705" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B">
    CREATIVE DIRECTION &amp; RUNWAY CURATION
  </text>
</svg>
